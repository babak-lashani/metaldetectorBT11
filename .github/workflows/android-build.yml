name: Build Metal Detector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project
        run: unzip -q MetalDetectorBT11.zip -d extracted
        

      - name: Fix repository configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/MetalDetectorBT/build.gradle")
          s = p.read_text()
          s = s.replace("""allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """, "")
          p.write_text(s)
          PY
          
      - name: Build APK
        run: gradle -p extracted/MetalDetectorBT assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetalDetectorBT11-APK
          path: extracted/MetalDetectorBT/app/build/outputs/apk/debug/app-debug.apk
          

name: Build Metal Detector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project
        run: unzip -q MetalDetectorBT11.zip -d extracted

      - name: Fix XML text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/MetalDetectorBT/app/src/main/res/layout/activity_main.xml")
          lines = p.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if 'android:text=' in line and 'پروتکل:' in line:
                  lines[i] = """            android:text='پروتکل: هر خط یک JSON با \\n — مثال: {"vdi":72,"sig":850,"depth":145,"size":18,"metal":1}'"""
                  break
          else:
              raise SystemExit("Protocol TextView not found")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          

      - name: Fix repository configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/MetalDetectorBT/build.gradle")
          s = p.read_text()
          s = s.replace("""allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """, "")
          p.write_text(s)
          PY
          
      - name: Build APK
        run: gradle -p extracted/MetalDetectorBT assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetalDetectorBT11-APK
          path: extracted/MetalDetectorBT/app/build/outputs/apk/debug/app-debug.apk
          

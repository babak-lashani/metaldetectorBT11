name: Build Metal Detector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -q MetalDetectorBT11.zip -d extracted
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          cd extracted/MetalDetectorBT
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetalDetectorBT11-APK
          path: extracted/MetalDetectorBT/app/build/outputs/apk/debug/app-debug.apk
